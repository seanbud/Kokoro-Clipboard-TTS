name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-model:
    name: Prepare offline Kokoro model
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download Kokoro model and voices
        env:
          # The Windows runner stalled in hf-xet while downloading this public
          # model. Use the standard HTTP client and keep concurrency modest.
          HF_HUB_DISABLE_XET: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check huggingface_hub
          python - <<'PY'
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id="hexgrad/Kokoro-82M",
              local_dir="sidecar/model",
              allow_patterns=["config.json", "kokoro-v1_0.pth", "voices/*.pt"],
              max_workers=4,
          )
          PY
          test -f sidecar/model/config.json
          test -f sidecar/model/kokoro-v1_0.pth
          test -n "$(find sidecar/model/voices -name '*.pt' -print -quit)"

      - name: Upload offline model bundle
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-offline-model
          path: sidecar/model
          retention-days: 1
          # Model weights are already compressed; skip CPU-intensive recompression.
          compression-level: 0

  build:
    needs: prepare-model
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-15
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && matrix.target || '' }}

      - name: Setup MSVC developer environment
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download offline model bundle
        uses: actions/download-artifact@v4
        with:
          name: kokoro-offline-model
          path: sidecar/model

      - name: Verify offline model bundle
        shell: bash
        run: |
          test -f sidecar/model/config.json
          test -f sidecar/model/kokoro-v1_0.pth
          test -n "$(find sidecar/model/voices -name '*.pt' -print -quit)"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Verify speech dependency compatibility
        shell: bash
        run: |
          python - <<'PY'
          from importlib.metadata import version

          import numpy
          import torch
          from transformers import AlbertConfig, AlbertModel, is_torch_available

          assert numpy.__version__ == "1.26.4", numpy.__version__
          assert version("transformers") == "4.57.6", version("transformers")
          assert is_torch_available(), f"Transformers disabled PyTorch {torch.__version__}"
          AlbertModel(AlbertConfig())
          print(
              "Speech dependencies compatible:",
              f"numpy={numpy.__version__}",
              f"torch={torch.__version__}",
              f"transformers={version('transformers')}",
          )
          PY

      - name: Build Sidecar with PyInstaller
        shell: bash
        run: |
          python scripts/build_sonic_dsp.py

          # Use platform-specific separator for --add-data
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            SEP=";"
            SONIC_LIBRARY="sidecar/native/sonic_kctts.dll"
            CODESIGN_ARGS=()
          else
            SEP=":"
            SONIC_LIBRARY="sidecar/native/libsonic_kctts.dylib"
            CODESIGN_ARGS=(--codesign-identity - --osx-entitlements-file src-tauri/sidecar.entitlements.plist)
          fi
          pyinstaller --onefile --name kokoro \
            "${CODESIGN_ARGS[@]}" \
            --add-data "sidecar/model${SEP}model" \
            --add-binary "${SONIC_LIBRARY}${SEP}native" \
            --collect-all kokoro \
            --collect-all misaki \
            --collect-all phonemizer \
            --collect-all language_tags \
            --collect-all espeakng_loader \
            --collect-all en_core_web_sm \
            --exclude-module onnxruntime \
            --exclude-module spacy.tests \
            sidecar/kokoro_server.py
          mkdir -p src-tauri/binaries
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            mv dist/kokoro.exe src-tauri/binaries/kokoro-x86_64-pc-windows-msvc.exe
          else
            mv dist/kokoro "src-tauri/binaries/kokoro-${{ matrix.target }}"
          fi

      - name: Run Python tests
        shell: bash
        run: |
          python -m unittest discover -s sidecar -p 'test_*.py'
          python -m unittest discover -s scripts -p 'test_*.py'

      - name: Verify frozen sidecar startup
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            SIDECAR="src-tauri/binaries/kokoro-x86_64-pc-windows-msvc.exe"
          else
            SIDECAR="src-tauri/binaries/kokoro-${{ matrix.target }}"
          fi

          "$SIDECAR" --port 8794 > sidecar-startup.log 2>&1 &
          SIDECAR_PID=$!
          cleanup_sidecar() {
            # PyInstaller --onefile uses a launcher and an extracted child process.
            # Terminate the child first so neither leaks into subsequent build steps.
            pkill -TERM -P "$SIDECAR_PID" 2>/dev/null || true
            kill "$SIDECAR_PID" 2>/dev/null || true
            wait "$SIDECAR_PID" 2>/dev/null || true
          }
          trap cleanup_sidecar EXIT

          for _ in {1..60}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8794/health; then
              cleanup_sidecar
              trap - EXIT
              exit 0
            fi
            sleep 1
          done

          cat sidecar-startup.log
          exit 1

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx vitest run

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Verify updater signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kokoro Clipboard TTS ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch][setup].[ext]"
          args: ${{ startsWith(matrix.platform, 'macos-') && format('--target {0}', matrix.target) || '' }}

  verify-updater-release:
    name: Verify signed updater release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Verify updater assets and platform metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mapfile -t assets < <(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )
          printf '%s\n' "${assets[@]}"

          printf '%s\n' "${assets[@]}" | grep --quiet --line-regexp 'latest.json'

          signature_count="$({ printf '%s\n' "${assets[@]}" | grep --count '\.sig$'; } || true)"
          test "$signature_count" -ge 3

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$temp_dir"

          expected_version="${RELEASE_TAG#v}"
          jq --exit-status --arg version "$expected_version" \
            '.version == $version' \
            "$temp_dir/latest.json"
          jq --exit-status '
            [
              "darwin-aarch64",
              "darwin-x86_64",
              "windows-x86_64"
            ] as $required
            | . as $release
            | all($required[]; (
                $release.platforms[.].url | type == "string" and length > 0
              ) and (
                $release.platforms[.].signature | type == "string" and length > 0
              ))
          ' "$temp_dir/latest.json"
