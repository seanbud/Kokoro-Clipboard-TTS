name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-15
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && matrix.target || '' }}

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Download Kokoro model and voices
        shell: bash
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id="hexgrad/Kokoro-82M",
              local_dir="sidecar/model",
              allow_patterns=["config.json", "kokoro-v1_0.pth", "voices/*.pt"],
          )
          PY

      - name: Build Sidecar with PyInstaller
        shell: bash
        run: |
          # Use platform-specific separator for --add-data
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            SEP=";"
            CODESIGN_ARGS=()
          else
            SEP=":"
            CODESIGN_ARGS=(--codesign-identity - --osx-entitlements-file src-tauri/sidecar.entitlements.plist)
          fi
          pyinstaller --onefile --name kokoro \
            "${CODESIGN_ARGS[@]}" \
            --add-data "sidecar/model${SEP}model" \
            --collect-all onnxruntime \
            --collect-all kokoro \
            --collect-all misaki \
            --collect-all phonemizer \
            --collect-all language_tags \
            --collect-all espeakng_loader \
            --collect-all huggingface_hub \
            --collect-all sounddevice \
            --collect-all soundfile \
            --collect-all torch \
            --collect-all loguru \
            --collect-all transformers \
            --collect-all spacy \
            --collect-all en_core_web_sm \
            sidecar/kokoro_server.py
          mkdir -p src-tauri/binaries
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            mv dist/kokoro.exe src-tauri/binaries/kokoro-x86_64-pc-windows-msvc.exe
          else
            mv dist/kokoro "src-tauri/binaries/kokoro-${{ matrix.target }}"
          fi

      - name: Verify frozen sidecar startup
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            SIDECAR="src-tauri/binaries/kokoro-x86_64-pc-windows-msvc.exe"
          else
            SIDECAR="src-tauri/binaries/kokoro-${{ matrix.target }}"
          fi

          "$SIDECAR" --port 8794 > sidecar-startup.log 2>&1 &
          SIDECAR_PID=$!
          cleanup_sidecar() {
            # PyInstaller --onefile uses a launcher and an extracted child process.
            # Terminate the child first so neither leaks into subsequent build steps.
            pkill -TERM -P "$SIDECAR_PID" 2>/dev/null || true
            kill "$SIDECAR_PID" 2>/dev/null || true
            wait "$SIDECAR_PID" 2>/dev/null || true
          }
          trap cleanup_sidecar EXIT

          for _ in {1..60}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8794/health; then
              cleanup_sidecar
              trap - EXIT
              exit 0
            fi
            sleep 1
          done

          cat sidecar-startup.log
          exit 1

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx vitest run

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kokoro Clipboard TTS ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch][setup].[ext]"
          args: ${{ startsWith(matrix.platform, 'macos-') && format('--target {0}', matrix.target) || '' }}
