<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <!--
    macOS menu-bar template artwork. The operating system supplies the color;
    only this alpha mask is rendered. Keep the geometry sparse enough to stay
    recognizable at the 22-point menu-bar size.
  -->
  <defs>
    <mask id="shiba-cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="44" height="44">
      <rect width="44" height="44" fill="#fff"/>

      <!-- The original icon's light ear centers, forehead blaze, eyes, and broad muzzle become negative space. -->
      <path fill="#000" d="m8.75 8.75 5.5 3.25-4.75 3.5ZM31.25 12l5.5-3.25-.75 6.75Z"/>
      <path fill="#000" d="M17 11.5h5v3h2v8h-9v-8h2Z"/>
      <rect x="9.5" y="20" width="6.5" height="3.25" rx="1.6" fill="#000"/>
      <rect x="25" y="20" width="6.5" height="3.25" rx="1.6" fill="#000"/>
      <path fill="#000" d="M9 29c1.4-4.1 5.1-6.1 10-3.6 4.9-2.5 8.6-.5 10 3.6v4.25C26.5 37.1 11.5 37.1 9 33.25Z"/>
    </mask>
  </defs>

  <!-- Squared ears, round cheeks, and flat chin deliberately follow the pixel Shiba silhouette. -->
  <path
    fill="#000"
    mask="url(#shiba-cutouts)"
    d="M6 17V6h7v4.5A18.5 18.5 0 0 1 20 9a18.5 18.5 0 0 1 7 1.5V6h7v11c2.2 3 2.5 7.2 1.2 12.1C33.5 35.6 28.4 39 20 39S6.5 35.6 4.8 29.1C3.5 24.2 3.8 20 6 17Z"
  />

  <!-- Reintroduce the large nose and simple mouth inside the negative-space muzzle. -->
  <rect x="16.75" y="25" width="4.5" height="3.25" rx=".8" fill="#000"/>
  <path d="M19 28v2.1m0 0c-1.5 1.45-3.25 1.45-4.75.35m4.75-.35c1.5 1.45 3.25 1.45 4.75.35" fill="none" stroke="#000" stroke-width="2.1" stroke-linecap="round"/>

  <!-- Three compact emphasis/sound marks preserve the signature detail to the right of the face. -->
  <g fill="none" stroke="#000" stroke-width="3" stroke-linecap="round">
    <path d="m38.25 13.25 2-1.25"/>
    <path d="M39 20h3"/>
    <path d="m38.25 26.75 2 1.25"/>
  </g>
</svg>
